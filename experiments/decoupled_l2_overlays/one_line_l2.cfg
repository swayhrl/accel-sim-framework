# Smallest IPOLY-valid direct-mapped L2 geometry for dirty-WBQ stress.
# The historical filename is retained, but a one-set cache is invalid with the
# V100 address mapper: it requires 16, 32, or 64 cache-set banks. Apply this
# common geometry to every arm; candidate capacity overlays remain arm-specific.
-gpgpu_cache:dl2 S:32:128:1,L:B:m:L:P,A:192:4,32:0,32
