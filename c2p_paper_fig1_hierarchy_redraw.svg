<svg xmlns="http://www.w3.org/2000/svg" width="700" height="410" viewBox="0 0 700 410">
  <title>C2P-Cache Figure 1: simplified GPU memory hierarchy</title>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#20252a"/></marker>
    <style>.box{stroke:#20252a;stroke-width:1.5}.sm{fill:#d8d8d8}.l1{fill:#d9eee7}.l2{fill:#c9cef5}.mem{fill:#9faee8}.body{font:18px Georgia,serif;fill:#20252a}.small{font:15px Georgia,serif;fill:#20252a}.noc{stroke:#334a9b;stroke-width:2;fill:none}.link{stroke:#5e5e5e;stroke-width:1.35;fill:none;marker-start:url(#arr);marker-end:url(#arr)}.core{stroke:#20252a;stroke-width:1.35;fill:none;marker-start:url(#arr);marker-end:url(#arr)}.caption{font:700 18px Georgia,serif;fill:#20252a}</style>
  </defs>
  <defs><g id="sm0"><rect x="0" y="0" width="58" height="62" class="box sm"/><text x="29" y="31" text-anchor="middle" class="body">SM</text><rect x="7" y="36" width="44" height="19" class="box l1"/><text x="29" y="51" text-anchor="middle" class="small">L1</text></g></defs>
  <rect width="700" height="410" fill="#fff"/>
  <use href="#sm0" x="202" y="38"/><use href="#sm0" x="282" y="38"/><use href="#sm0" x="362" y="38"/><use href="#sm0" x="442" y="38"/>
  <path d="M180 132H522" class="noc"/>
  <rect x="282" y="160" width="138" height="28" class="box l2"/><text x="351" y="181" text-anchor="middle" class="body">L2</text>
  <rect x="220" y="220" width="262" height="34" class="box mem"/><text x="351" y="245" text-anchor="middle" class="body">Global Memory</text>
  <path d="M231 100V132M311 100V132M391 100V132M471 100V132" class="link"/>
  <path d="M351 132V160M351 188V220" class="core"/>
  <text x="351" y="330" text-anchor="middle" class="caption">Figure 1: Simplified GPU memory hierarchy.</text>
</svg>
