<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24313b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2878a8"/></marker>
    <style>
      .title{font:700 32px 'DejaVu Sans',sans-serif;fill:#18232b}.subtitle{font:18px 'DejaVu Sans',sans-serif;fill:#52616b}.label{font:700 21px 'DejaVu Sans',sans-serif;fill:#18232b}.text{font:17px 'DejaVu Sans',sans-serif;fill:#26343d}.small{font:15px 'DejaVu Sans',sans-serif;fill:#52616b}.box{stroke:#24313b;stroke-width:2.2;rx:14}.flow{fill:none;stroke:#24313b;stroke-width:3;marker-end:url(#arrow)}.data{fill:none;stroke:#2878a8;stroke-width:3.5;marker-end:url(#arrowBlue)}.fallback{fill:none;stroke:#687780;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="70" y="74" class="title">C2P-Cache experimental request path</text>
  <text x="70" y="108" class="subtitle">Snapshot candidate pruning preserves the normal shared-L2 path as a bounded fallback.</text>

  <rect x="70" y="250" width="205" height="172" class="box" fill="#eaf3f8"/>
  <text x="172" y="300" text-anchor="middle" class="label">Requester SM</text>
  <text x="172" y="335" text-anchor="middle" class="text">private L1 miss</text>
  <text x="172" y="365" text-anchor="middle" class="small">line address + requester id</text>
  <path d="M105 390 H240" stroke="#2878a8" stroke-width="4"/>

  <rect x="355" y="210" width="265" height="250" class="box" fill="#f8ece5"/>
  <text x="487" y="250" text-anchor="middle" class="label">Snapshot / Bloom</text>
  <text x="487" y="278" text-anchor="middle" class="label">matrix</text>
  <text x="487" y="307" text-anchor="middle" class="text">parallel candidate lookup</text>
  <rect x="392" y="323" width="190" height="24" rx="5" fill="#e89b88"/>
  <rect x="392" y="358" width="145" height="24" rx="5" fill="#e89b88" opacity=".78"/>
  <rect x="392" y="393" width="99" height="24" rx="5" fill="#e89b88" opacity=".55"/>

  <rect x="715" y="250" width="210" height="172" class="box" fill="#f7f4df"/>
  <text x="820" y="300" text-anchor="middle" class="label">Candidate engine</text>
  <text x="820" y="334" text-anchor="middle" class="text">bounded remote probes</text>
  <text x="820" y="365" text-anchor="middle" class="small">one request remains in flight</text>

  <rect x="1040" y="176" width="440" height="330" class="box" fill="#eef4ec"/>
  <text x="1260" y="225" text-anchor="middle" class="label">Peer L1 endpoints</text>
  <text x="1260" y="256" text-anchor="middle" class="small">candidate tag lookups; exact match decides remote hit</text>
  <rect x="1084" y="296" width="106" height="114" class="box" fill="#dbece1"/>
  <rect x="1207" y="296" width="106" height="114" class="box" fill="#dbece1"/>
  <rect x="1330" y="296" width="106" height="114" class="box" fill="#dbece1"/>
  <text x="1137" y="342" text-anchor="middle" class="text">target L1</text><text x="1137" y="371" text-anchor="middle" class="small">tag + data</text>
  <text x="1260" y="342" text-anchor="middle" class="text">target L1</text><text x="1260" y="371" text-anchor="middle" class="small">tag + data</text>
  <text x="1383" y="342" text-anchor="middle" class="text">target L1</text><text x="1383" y="371" text-anchor="middle" class="small">tag + data</text>

  <rect x="670" y="655" width="270" height="150" class="box" fill="#edf0f2"/>
  <text x="805" y="708" text-anchor="middle" class="label">Shared L2 / DRAM path</text>
  <text x="805" y="741" text-anchor="middle" class="text">normal cache miss service</text>
  <text x="805" y="772" text-anchor="middle" class="small">no peer hit, timeout, or queue fallback</text>

  <rect x="1195" y="640" width="235" height="145" class="box" fill="#eaf3f8"/>
  <text x="1312" y="694" text-anchor="middle" class="label">Requester fill / response</text>
  <text x="1312" y="728" text-anchor="middle" class="text">complete original miss</text>
  <text x="1312" y="758" text-anchor="middle" class="small">remote hit avoids one L2 request</text>

  <path d="M275 336 H355" class="flow"/>
  <path d="M620 336 H715" class="flow"/>
  <path d="M925 336 H1040" class="flow"/>
  <path d="M1137 410 C1137 555,1260 515,1260 640" class="data"/>
  <text x="1136" y="550" class="small" fill="#2878a8">remote-hit data return</text>
  <path d="M820 422 V655" class="fallback"/>
  <text x="842" y="555" class="small">no exact peer / bounded fallback</text>
  <path d="M940 730 H1195" class="data"/>

  <path d="M69 574 H1480" stroke="#d6dde1" stroke-width="2"/>
  <text x="70" y="615" class="label">Audit contract used by the experiments</text>
  <circle cx="95" cy="662" r="7" fill="#2878a8"/><text x="115" y="668" class="text">default-off observation leaves cycles and base C2P counters unchanged</text>
  <circle cx="95" cy="711" r="7" fill="#2878a8"/><text x="115" y="717" class="text">local + outer counters conserve candidates, probes, hits, and misses</text>
  <circle cx="95" cy="760" r="7" fill="#2878a8"/><text x="115" y="766" class="text">each completed remote hit corresponds to one avoided L2 request</text>
  <text x="70" y="855" class="small">Experimental abstraction: illustrates the measured C2P control/data paths; not a transistor-level implementation diagram.</text>
</svg>
