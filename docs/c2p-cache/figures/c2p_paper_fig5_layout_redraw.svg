<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380">
  <title>C2P-Cache Figure 5 layout redraw</title>
  <desc>Independent high-fidelity layout redraw adapted from the mechanism flow in C2P-Cache Figure 5, not a copy of the published artwork.</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#6f8df0"/></marker>
    <marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#74828a"/></marker>
    <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#67d2c7"/></marker>
    <style>
      .title{font:700 17px Georgia,serif;fill:#121a1f}.label{font:12px Georgia,serif;fill:#121a1f}.small{font:15px Georgia,serif;fill:#27343a}.tiny{font:13px Georgia,serif;fill:#4a5961}.box{fill:#fff;stroke:#202b30;stroke-width:1.7}.arrow{fill:none;stroke:#6f8df0;stroke-width:2.2;marker-end:url(#blue)}.teal{fill:none;stroke:#67d2c7;stroke-width:2.2;marker-end:url(#teal)}.dash{fill:none;stroke:#74828a;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#gray)}.num{font:700 12px Georgia,serif;fill:#fff}.numbg{fill:#17242a}
    </style>
  </defs>
  <rect width="1200" height="720" fill="white"/>
  <text x="80" y="347" class="title">Figure 5: Overview of C2P-Cache.</text>

  <!-- L1 cache stack -->
  <g transform="translate(82,175)">
    <rect x="18" y="-21" width="80" height="52" class="box" fill="#edf5f2"/><rect x="12" y="-14" width="80" height="52" class="box" fill="#edf5f2"/><rect x="6" y="-7" width="80" height="52" class="box" fill="#edf5f2"/><rect x="0" y="0" width="80" height="52" class="box" fill="#edf5f2"/>
    <text x="40" y="33" text-anchor="middle" class="label">L1 Cache</text>
  </g>

  <!-- BF engines -->
  <g transform="translate(205,160)">
    <path d="M0 0h11l9 9-9 9H0z" fill="#c4d0fa" stroke="#91a8ec"/><path d="M26 0h11l9 9-9 9H26z" fill="#d0ede8" stroke="#8ac8bd"/>
    <path d="M0 26h11l9 9-9 9H0z" fill="#c4d0fa" stroke="#91a8ec"/><path d="M26 26h11l9 9-9 9H26z" fill="#d0ede8" stroke="#8ac8bd"/>
    <text x="23" y="72" text-anchor="middle" class="label">BF Engines</text>
  </g>

  <!-- Access matrix -->
  <g transform="translate(285,184)">
    <rect x="0" y="0" width="34" height="34" class="box"/>
    <path d="M8.5 0v34M17 0v34M25.5 0v34M0 8.5h34M0 17h34M0 25.5h34" stroke="#202b30" stroke-width="1"/>
    <rect x="9" y="9" width="7" height="7" fill="#dce3fd"/><rect x="26" y="18" width="7" height="7" fill="#dce3fd"/>
    <text x="17" y="57" text-anchor="middle" class="label">Access</text><text x="17" y="76" text-anchor="middle" class="label">Matrix</text>
  </g>

  <!-- Boolean match and snapshot -->
  <g transform="translate(355,182)">
    <circle cx="0" cy="18" r="11" fill="white" stroke="#202b30" stroke-width="1.7"/><text x="0" y="23" text-anchor="middle" class="label">×</text>
    <rect x="45" y="0" width="29" height="54" class="box"/>
    <path d="M52 0v54M59 0v54M66 0v54M45 10.8h29M45 21.6h29M45 32.4h29M45 43.2h29" stroke="#202b30" stroke-width=".9"/>
    <rect x="60" y="22" width="6" height="8" fill="#d7f0ea"/><rect x="67" y="44" width="6" height="8" fill="#d7f0ea"/>
    <text x="60" y="76" text-anchor="middle" class="label">Snapshot</text><text x="60" y="95" text-anchor="middle" class="label">Matrix</text>
  </g>

  <!-- Result matrix -->
  <g transform="translate(347,252)">
    <rect x="0" y="0" width="32" height="32" class="box"/>
    <path d="M8 0v32M16 0v32M24 0v32M0 8h32M0 16h32M0 24h32" stroke="#202b30" stroke-width="1"/>
    <rect x="17" y="9" width="7" height="7" fill="#8a5cc5"/>
    <text x="16" y="55" text-anchor="middle" class="label">Result Matrix</text>
  </g>

  <!-- Update path -->
  <path d="M162 165 H205" class="teal"/>
  <circle cx="184" cy="148" r="9" class="numbg"/><text x="184" y="152" text-anchor="middle" class="num">a</text>
  <path d="M250 169 H400 V182" class="teal"/>
  <circle cx="307" cy="152" r="9" class="numbg"/><text x="307" y="156" text-anchor="middle" class="num">b</text>

  <!-- miss path -->
  <path d="M162 205 H205" class="arrow"/><circle cx="183" cy="194" r="9" class="numbg"/><text x="183" y="198" text-anchor="middle" class="num">1</text>
  <path d="M250 195 H285" class="arrow"/><circle cx="267" cy="184" r="9" class="numbg"/><text x="267" y="188" text-anchor="middle" class="num">2</text>
  <path d="M319 201 H344" class="arrow"/><path d="M366 200 H400" class="arrow"/><circle cx="382" cy="228" r="9" class="numbg"/><text x="382" y="232" text-anchor="middle" class="num">3</text>
  <path d="M355 211 V252" class="dash"/><circle cx="332" cy="230" r="9" class="numbg"/><text x="332" y="234" text-anchor="middle" class="num">4</text>
  <path d="M347 268 C285 268,162 260,162 215" class="dash"/>
</svg>
