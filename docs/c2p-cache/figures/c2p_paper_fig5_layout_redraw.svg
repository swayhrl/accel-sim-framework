<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380">
  <title>C2P-Cache Figure 5 layout redraw</title>
  <desc>Independent high-fidelity layout redraw adapted from the mechanism flow in C2P-Cache Figure 5, not a copy of the published artwork.</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#6f8df0"/></marker>
    <marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#74828a"/></marker>
    <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#67d2c7"/></marker>
    <style>
      .title{font:700 17px Georgia,serif;fill:#121a1f}.label{font:12px Georgia,serif;fill:#121a1f}.small{font:15px Georgia,serif;fill:#27343a}.tiny{font:13px Georgia,serif;fill:#4a5961}.box{fill:#fff;stroke:#202b30;stroke-width:1.7}.arrow{fill:none;stroke:#6f8df0;stroke-width:2.2;marker-end:url(#blue)}.teal{fill:none;stroke:#67d2c7;stroke-width:2.2;marker-end:url(#teal)}.dash{fill:none;stroke:#74828a;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#gray)}.num{font:700 12px Georgia,serif;fill:#fff}.numbg{fill:#17242a}
    </style>
  </defs>
  <rect width="1200" height="720" fill="white"/>
  <text x="80" y="347" class="title">Figure 5: Overview of C2P-Cache.</text>

  <!-- L1 cache stack -->
  <g transform="translate(82,175)">
    <rect x="18" y="-21" width="80" height="52" class="box" fill="#edf5f2"/><rect x="12" y="-14" width="80" height="52" class="box" fill="#edf5f2"/><rect x="6" y="-7" width="80" height="52" class="box" fill="#edf5f2"/><rect x="0" y="0" width="80" height="52" class="box" fill="#edf5f2"/>
    <text x="40" y="33" text-anchor="middle" class="label">L1 Cache</text>
  </g>

  <!-- BF engines -->
  <g transform="translate(205,135)">
    <path d="M0 0h11l9 9-9 9H0z" fill="#c4d0fa" stroke="#91a8ec"/><path d="M26 0h11l9 9-9 9H26z" fill="#d0ede8" stroke="#8ac8bd"/>
    <path d="M0 26h11l9 9-9 9H0z" fill="#c4d0fa" stroke="#91a8ec"/><path d="M26 26h11l9 9-9 9H26z" fill="#d0ede8" stroke="#8ac8bd"/>
    <path d="M0 52h11l9 9-9 9H0z" fill="#c4d0fa" stroke="#91a8ec"/><path d="M26 52h11l9 9-9 9H26z" fill="#d0ede8" stroke="#8ac8bd"/>
    <text x="23" y="86" text-anchor="middle" class="label">BF Engines</text>
  </g>

  <!-- Access matrix -->
  <g transform="translate(300,180)">
    <rect x="0" y="0" width="49" height="30" class="box"/>
    <rect x="0" y="7.5" width="49" height="7.5" fill="#dce3fd"/>
    <path d="M7 0v30M14 0v30M21 0v30M28 0v30M35 0v30M42 0v30M0 7.5h49M0 15h49M0 22.5h49" stroke="#202b30" stroke-width=".9"/>
    <text x="24.5" y="51" text-anchor="middle" class="label">Access</text><text x="24.5" y="69" text-anchor="middle" class="label">Matrix</text>
  </g>

  <!-- Boolean match and snapshot -->
  <g transform="translate(385,177)">
    <circle cx="0" cy="18" r="11" fill="white" stroke="#202b30" stroke-width="1.7"/>
    <path d="M-8 10L8 26M-8 26L8 10" stroke="#202b30" stroke-width="1.7" stroke-linecap="round"/>
    <rect x="40" y="-7" width="29" height="50" class="box"/>
    <path d="M47 -7v50M54 -7v50M61 -7v50M40 .14h29M40 7.28h29M40 14.42h29M40 21.56h29M40 28.70h29M40 35.84h29" stroke="#202b30" stroke-width=".9"/>
    <rect x="54" y="-7" width="7" height="50" fill="#d7f0ea"/>
    <text x="54.5" y="65" text-anchor="middle" class="label">Snapshot</text><text x="54.5" y="83" text-anchor="middle" class="label">Matrix</text>
  </g>

  <!-- Result matrix -->
  <g transform="translate(372,260)">
    <rect x="0" y="0" width="28" height="28" class="box"/>
    <path d="M7 0v28M14 0v28M21 0v28M0 7h28M0 14h28M0 21h28" stroke="#202b30" stroke-width=".9"/>
    <rect x="14" y="7" width="7" height="7" fill="#8a5cc5"/>
    <text x="14" y="48" text-anchor="middle" class="label">Result Matrix</text>
  </g>

  <!-- Update path -->
  <path d="M162 165 H205" class="teal"/>
  <circle cx="184" cy="148" r="9" class="numbg"/><text x="184" y="152" text-anchor="middle" class="num">a</text>
  <path d="M250 144 H425 V170" class="teal"/>
  <circle cx="307" cy="127" r="9" class="numbg"/><text x="307" y="131" text-anchor="middle" class="num">b</text>

  <!-- miss path -->
  <path d="M162 196 H205" class="arrow"/><circle cx="183" cy="185" r="9" class="numbg"/><text x="183" y="189" text-anchor="middle" class="num">1</text>
  <path d="M250 196 H300" class="arrow"/><circle cx="272" cy="184" r="9" class="numbg"/><text x="272" y="188" text-anchor="middle" class="num">2</text>
  <path d="M349 195 H374" class="arrow"/><path d="M396 195 H425" class="arrow"/><circle cx="385" cy="228" r="9" class="numbg"/><text x="385" y="232" text-anchor="middle" class="num">3</text>
  <path d="M385 206 V260" class="dash"/>
  <path d="M108 227 V270 H372" class="dash"/><circle cx="260" cy="258" r="9" class="numbg"/><text x="260" y="262" text-anchor="middle" class="num">4</text>
</svg>
