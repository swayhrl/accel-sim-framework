<text x="1732.0" y="300.0" text-anchor="end" dominant-baseline="alphabetic" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#D66A2C">0.0916%</text>
