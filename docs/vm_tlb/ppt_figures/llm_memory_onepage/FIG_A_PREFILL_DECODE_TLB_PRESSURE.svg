<text x="1048.0" y="710.0" text-anchor="start" dominant-baseline="alphabetic" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#203040">Translation MSHR-full 事件</text>
<text x="1048.0" y="758.0" text-anchor="start" dominant-baseline="alphabetic" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#D66A2C">full-ROI 累计：2.30M</text>
<text x="1048.0" y="795.0" text-anchor="start" dominant-baseline="alphabetic" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#203040">30.35K events / 1M translation requests</text>
<rect x="150.0" y="888.0" width="1620.0" height="86.0" fill="#F3F6F9" rx="14" ry="14" stroke="#D8E0E8" stroke-width="1"/>
<text x="960.0" y="931.0" text-anchor="middle" dominant-baseline="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#17324D">结论：Prefill 更偏翻译覆盖范围/容量压力；Decode 更偏高代价未命中、并发与长尾压力。</text>
<text x="150.0" y="1022.0" text-anchor="start" dominant-baseline="alphabetic" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#657587">注：MSHR-full 为事件计数，归一化仅用于表示每百万 translation requests 的事件密度，不是请求发生率。</text>
