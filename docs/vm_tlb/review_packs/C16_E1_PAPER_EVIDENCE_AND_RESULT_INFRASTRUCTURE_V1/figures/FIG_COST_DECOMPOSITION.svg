<svg xmlns="http://www.w3.org/2000/svg" width="920" height="513" viewBox="0 0 920 513" role="img" aria-label="BFULL native top-level timing decomposition">
<title>BFULL native top-level timing decomposition</title>
<desc>Run-aligned categories; plotted medians need not sum exactly. Bars show signed values in ms; blue is positive and orange is negative.</desc>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#172033} .title{font-size:22px;font-weight:bold} .sub{font-size:13px;fill:#526072} .label{font-size:14px} .value{font-size:13px;font-weight:bold}</style>
<text class="title" x="30" y="38">BFULL native top-level timing decomposition</text>
<text class="sub" x="30" y="63">Run-aligned categories; plotted medians need not sum exactly</text>
<line x1="535.0" y1="80" x2="535.0" y2="478" stroke="#526072"/>
<text class="label" x="30" y="121">MLP top level</text>
<rect x="535.0" y="105" width="197.6" height="25" fill="#1976a3"/>
<text class="value" text-anchor="start" x="740.6" y="123">0.3981 ms</text>
<text class="label" x="30" y="179">Self-attention top level</text>
<rect x="270.0" y="163" width="265.0" height="25" fill="#c45c42"/>
<text class="value" text-anchor="end" x="262.0" y="181">-0.5338 ms</text>
<text class="label" x="30" y="237">Norm top level</text>
<rect x="535.0" y="221" width="36.7" height="25" fill="#1976a3"/>
<text class="value" text-anchor="start" x="579.7" y="239">0.07389 ms</text>
<text class="label" x="30" y="295">Final stage</text>
<rect x="535.0" y="279" width="0.0" height="25" fill="#1976a3"/>
<text class="value" text-anchor="start" x="543.0" y="297">3.195e-05 ms</text>
<text class="label" x="30" y="353">Unexplained residual</text>
<rect x="535.0" y="337" width="3.0" height="25" fill="#1976a3"/>
<text class="value" text-anchor="start" x="546.0" y="355">0.006113 ms</text>
<text class="label" x="30" y="411">Observed decode</text>
<rect x="521.3" y="395" width="13.7" height="25" fill="#c45c42"/>
<text class="value" text-anchor="end" x="513.3" y="413">-0.02765 ms</text>
</svg>
